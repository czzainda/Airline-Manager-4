name: Playwright Tests
on:
  schedule:
    - cron: '7 * * * *'

  workflow_dispatch:
    inputs:
      aktifkan_random_delay:
        description: 'Centang untuk aktifkan Random Delay (Default: ON)'
        type: boolean
        required: false
        default: true
      paksa_simpan_video:
        description: 'Centang jika ingin paksa rekam video untuk ditonton (Default: OFF)'
        type: boolean
        required: false
        default: false

# GITHUB_TOKEN needs actions:write so the chain job can dispatch the next run.
permissions:
  contents: read
  actions: write

# Never run two bot copies at once (game login conflicts); queue instead.
concurrency:
  group: am4-bot
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 29
    runs-on: ubuntu-22.04

    # Hak akses wajib agar bot bisa melakukan push commit ke dalam repositori
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Random Delay
      # Langkah ini hanya berjalan jika opsi 'aktifkan_random_delay' bernilai true (tercentang)
      if: github.event.inputs.aktifkan_random_delay == 'true' || github.event.inputs.aktifkan_random_delay == ''
      run: |
         DELAY=$(( RANDOM % 1500 ))
         echo "Menunggu $DELAY detik..."
         sleep $DELAY

    - uses: actions/setup-node@v4
      with:
        node-version: '22' # Aman dari bug freeze ekstraksi ZIP

    - name: Install dependencies
      run: npm ci

    - name: Get Playwright version
      id: pw-version
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    - uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

    - name: Disable Man-DB Auto-Update
      run: |
        sudo debconf-set-selections <<< "man-db man-db/auto-update boolean false"
        sudo dpkg-reconfigure man-db

    - name: Install Playwright Browsers & System Dependencies
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
      run: npx playwright install --with-deps chromium

    - name: Install Xvfb (Virtual Display Layer)
      # Menambahkan alat Xvfb agar server Linux memiliki layar monitor virtual
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Create .env file
      run: |
        touch .env
        echo "EMAIL=${{ secrets.EMAIL }}" >> .env
        echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
        echo "MAX_FUEL_PRICE=${{ vars.MAX_FUEL_PRICE }}" >> .env
        echo "MAX_CO2_PRICE=${{ vars.MAX_CO2_PRICE }}" >> .env
        echo "INCREASE_AIRLINE_REPUTATION=${{ vars.INCREASE_AIRLINE_REPUTATION }}" >> .env
        echo "CAMPAIGN_TYPE=${{ vars.CAMPAIGN_TYPE }}" >> .env
        echo "CAMPAIGN_DURATION=${{ vars.CAMPAIGN_DURATION }}" >> .env
        # --- PERBAIKAN BARU: Memasukkan variabel maintenance dinamis ---
        echo "REPAIR_WEAR=${{ vars.REPAIR_WEAR }}" >> .env
        echo "HOURS_CHECK=${{ vars.HOURS_CHECK }}" >> .env

    - name: Run Playwright tests (Headed Mode via Xvfb)
      env:
        PAKSI_VIDEO: ${{ github.event.inputs.paksa_simpan_video }}
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npx playwright test --headed

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always() # Tetap selalu upload seperti bawaan asli Anda
      with:
        name: playwright-report
        path: test-results/
        retention-days: 7

    # SOLUSI KOREKSI: Otomatis push file last-commit.txt jika ada perubahan dari script spec.ts
    - name: Keepalive Via Auto Commit
      if: always()
      run: |
        # Konfigurasi identitas Git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Cek apakah ada perubahan nyata pada file last-commit.txt
        if [ -f "last-commit.txt" ] && git status --porcelain | grep -q "last-commit.txt"; then
          echo "Terdeteksi perubahan pada last-commit.txt. Menjalankan auto-commit..."
          git add last-commit.txt
          # Tag [skip ci] wajib agar commit ini tidak memicu run tes baru secara berulang-ulang
          git commit -m "chore: keepalive update [skip ci]"
          git push
        else
          echo "Tidak ada perubahan pada last-commit.txt (Bukan tanggal 1 atau sudah di-commit pada sesi sebelumnya). Git tetap bersih."
        fi

  # Self-perpetuating hourly chain: no external scheduler needed.
  # After the bot finishes (even if it fails), wait until the next :07 UTC
  # and dispatch the next run using the built-in GITHUB_TOKEN.
  chain-next:
    name: Chain next hourly run
    needs: test
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Wait until next :07 UTC
        run: |
          # Sleep until 7 minutes past the next hour (UTC), keeping an hourly
          # cadence without any external scheduler. Pure arithmetic, no
          # `date -d` relative parsing (which misreads "+1 hour" as a tz offset).
          now_min=$(date -u +%M)
          now_sec=$(date -u +%S)
          elapsed=$(( 10#$now_min * 60 + 10#$now_sec ))
          if [ "$elapsed" -lt 420 ]; then
            sleep_for=$(( 420 - elapsed ))
          else
            sleep_for=$(( 3600 + 420 - elapsed ))
          fi
          echo "Sleeping ${sleep_for}s until next :07 UTC, then dispatching next run"
          sleep "$sleep_for"
      - name: Dispatch next run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "/repos/czzainda/Airline-Manager-4/actions/workflows/playwright.yml/dispatches" -f ref=main -f inputs[aktifkan_random_delay]=false
          echo "Next hourly run dispatched"
